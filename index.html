  {zh: `後遇異人傳授真道，至殷末已活七百六十七歲而不衰，後不知其所去。`, en: `He later encountered an extraordinary person who transmitted to him the true path. By the end of the Shang Dynasty, he had lived 767 years without declining; whereabouts afterward unknown.`},
  {zh: `因其封地為大彭，故世稱彭祖。`, en: `Because his fief was called Da Peng (大彭), he is known to the world as Ancestor Peng.`},
  {zh: `彭祖修持功深，列諸仙之長，受封為長生大帝，管轄南天門，亦稱南極仙翁、南極長生司命君，於此三曹普渡之際，專司大仙拔渡之職。`, en: `Ancestor Peng's cultivation was deeply attained; ranked first among the immortals. He was conferred the title Longevity Great Emperor, governing the South Heavenly Gate. Also called the Southern Pole Immortal Elder and the Southern Pole Longevity Life-Ruler. During this time of the Three Realms' universal salvation, he holds the specific duty of delivering the great immortals.`},
  {zh: `（五）巡天元帥：姓岳名飛，字鵬舉，宋朝湯陰人，家貧力學，事母至孝，應募出征，神勇無比，智勇雙全，屢戰屢勝，金兵聞之喪膽，皆云天兵下降，宋高宗手書「精忠報國」賜之，為奸臣秦檜所忌，以莫須有罪名處死，年三十九。`, en: `(5) Sky-Patrolling Marshal: family name Yue (岳), given name Fei (飛), courtesy name Pengju (鵬舉). Born in Tangyin during the Song Dynasty, from a poor family yet devoted to learning; served his mother with the utmost filial piety. Enlisting in the military, his courage and valor were incomparable; both wisdom and bravery were supreme. He won every battle, and the Jin troops trembled at his name, calling him a Heaven-descended force. Emperor Gaozong of Song personally inscribed 'Serve the Nation with Utmost Loyalty' (精忠報國) and bestowed it upon him. Killed by the treacherous minister Qin Hui on fabricated charges at the age of thirty-nine.`},
  {zh: `後世尊為穆聖，立廟建寺稱岳武穆王，後又封為巡天元帥之職。`, en: `Later generations revered him as a martial sage, building temples and calling him King Yue Wumu (岳武穆王). He was later conferred the title of Sky-Patrolling Marshal.`},
  {zh: `（六）關聖帝君：三國蜀漢解州人，姓關名羽，字雲長，有膽識，智勇過人，好讀春秋，義薄雲天，後世尊之為神人武聖。`, en: `(6) Sacred Emperor Guan (關聖帝君): a person of Jiezhou in the Han kingdom of Shu during the Three Kingdoms period. Family name Guan (關), given name Yu (羽), courtesy name Yunchang (雲長). He possessed great courage and wisdom that surpassed others, was fond of reading the Spring and Autumn Annals (春秋), and his righteousness was as vast as the sky. Later generations revered him as a divine martial sage.`},
  {zh: `因其護正除邪，屢建神功，後封為【佛號簡介】
【佛號簡介】伏魔大帝，亦稱關聖帝君。`, en: `Because he upheld righteousness and expelled evil, repeatedly performing divine feats, he was later conferred the title Demon-Subduing Great Emperor (伏魔大帝), also known as the Sacred Emperor Guan.`},
  {zh: `其英武浩然，正氣凜然，流垂千古，神蹟之顯化，實不勝枚舉。`, en: `His heroic valor, righteous aura, and upright spirit have endured through the ages — the manifestations of his divine miracles are truly too numerous to recount.`},
  {zh: `（七）桓侯大帝：三國蜀漢涿邵人，姓張名飛，字翼德，為人甚重義氣，嫉惡如仇，驍勇過人，對君子義士敬愛踰恆，個性略為粗猛，然心直氣正，不茍曲諛，後封為桓侯大帝。`, en: `(7) Marquis Huan Great Emperor (桓侯大帝): a person of Zhuoshao in the Han kingdom of Shu during the Three Kingdoms period. Family name Zhang (張), given name Fei (飛), courtesy name Yide (翼德). A man who highly valued righteousness and hated evil; his valor surpassed all others. He treated noble men and righteous knights with exceptional reverence and love; his temperament was somewhat fierce, yet his heart was upright and honest — not given to flattery. He was later conferred the title Marquis Huan Great Emperor.`},
  {zh: `（八）東嶽大帝：商朝末年人，姓黃名飛虎，正直無私保國愛民，乃商末之一員虎將，卒後封為東嶽大帝。`, en: `(8) Eastern Sacred Mountain Great Emperor (東嶽大帝): a person of the late Shang Dynasty, family name Huang (黃), given name Feihu (飛虎). Upright, selfless, protecting the nation and loving the people — a fierce general of the late Shang era. After his passing, he was conferred the title Eastern Sacred Mountain Great Emperor.`},
  {zh: `64灶君司掌灶火，也掌管記錄人間每個人的言行善惡，分形化身於各家灶中之神，稱「灶君」。`, en: `The Kitchen God: oversees the kitchen fire and also records the words, actions, good and evil of every person in the human world. The deity who takes form in each household's kitchen is called the 'Kitchen God' (灶君).`},
  {zh: `民間廟宇記載：灶神姓張名宙，字單，號子郭，是黃帝第十三代子孫，因其發明「火」而降世為灶神。`, en: `According to folk temple records: the Kitchen God's family name is Zhang (張), given name Zhou (宙), courtesy name Dan (單), style name Zi Guo (子郭) — the 13th-generation descendant of the Yellow Emperor, who descended to become the Kitchen God because he invented 'fire.'`},
  {zh: `每年農曆十二月廿四日的「送灶神」，和農曆初五的「接灶神」，可知灶神是民間和上天的「聯絡官」，由灶神的「上天奏好事，下界降吉祥。`, en: `The annual 'Sending Off the Kitchen God' on the 24th day of the 12th lunar month, and the 'Welcoming the Kitchen God' on the 5th day of the new year, illustrate that the Kitchen God serves as a 'liaison officer' between the people and Heaven. Through the Kitchen God's role of 'reporting good deeds to Heaven above, and bringing down auspiciousness to the realm below,'`},
  {zh: `」使我們「天人合一」的理想實現矣。`, en: `our ideal of 'unity of Heaven and humanity' (天人合一) is realized.`},
  {zh: `鎮殿元帥悟禪師兄。`, en: `Temple-Guarding Marshal: Elder Brother Wu Chan (悟禪師兄).`},
  {zh: `宋朝時冒充濟公，扶弱濟貧，退卻強魔，蒙受濟公活佛收為弟子。`, en: `During the Song Dynasty, he impersonated Ji-Gong, supporting the weak and aiding the poor, driving back powerful demons, and was taken as a disciple by the Living Buddha Ji-Gong.`},
  {zh: `有詩曰：「得道紹興南，出家會稽山，神通多廣大，捨藥濟貧寒，修行飛龍山，道德五千年，拜在貧僧面，賜名叫悟禪。`, en: `A poem reads: 'Attained the Tao in southern Shaoxing, left home at Kuaiji Mountain; spiritual powers were great and vast, gave medicine to relieve the poor; cultivated at Flying Dragon Mountain, Tao virtue five thousand years; bowed before the humble monk's face, bestowed the name Wu Chan.'`},
  {zh: `」三期出世為師尊之子，成道後封為鎮殿元帥。`, en: `In the Third Period, he was born as the Holy Teacher's son; after attaining the Tao, he was conferred the title Temple-Guarding Marshal.`},
  {zh: `鎮殿將軍茂田師兄。`, en: `Temple-Guarding General: Elder Brother Mao Tian (茂田師兄).`},
  {zh: `師尊之子，在世時協助師尊辦道，歸空後封為鎮殿將軍，亦是天佛院主管，專司懺悔之監判及主考三天。`, en: `The Holy Teacher's son; during his life he assisted the Holy Teacher in spreading the Tao. After passing, he was conferred the title Temple-Guarding General and also serves as the administrator of the Heavenly Buddha Academy, specifically overseeing the adjudication of repentance and the Three-Day Examination.`},
  {zh: `65教化菩薩俗姓何，名雲婷，聖號雲遊大仙。`, en: `Teaching Bodhisattva: secular family name He (何), given name Yunting (雲婷), holy title Wandering Immortal (雲遊大仙).`},
  {zh: `原為氣天大仙雲遊姑娘，求道前適逢瘟疫之災，到處顯化救渡眾生，同時醫癒師母聖體，以其發願助道，因助辦三曹普渡有功，教化冥頑，功德很大，又封為教化菩薩，通稱為教化師姐，是師尊領天命後第一位超拔之氣天仙。`, en: `Originally a great Qi-Heaven immortal known as the Wandering Maiden (雲遊姑娘). Before seeking the Tao, she encountered a plague epidemic and manifested everywhere to rescue beings, while also healing the Holy Mother's sacred body. Having made a vow to assist the Tao, for her meritorious service in helping to carry out the universal salvation of the Three Realms and transforming the obstinate, her virtue was immense — she was conferred the title Teaching Bodhisattva (教化菩薩), commonly called Elder Sister Teacher (教化師姐). She was the first Qi-Heaven immortal delivered after the Holy Teacher received the Heavenly Mandate.`},
  {zh: `【佛號簡介】
【佛號簡介】各位大仙已過世之忠臣、孝子、烈女、節婦、或煉氣之士，或唸佛參禪而未證果位者，因有大善德，得原人救渡，經長生大帝批准，受師之末後一著真傳，點開通天眼，頓超南天門。`, en: `【Brief Introduction to the Divine Titles】 Immortal Elders: those who have passed away — loyal ministers, filial sons, heroic women, chaste wives, or practitioners of qi cultivation, or those who chanted the Buddha's name or practiced Zen meditation without yet attaining the fruit of Buddhahood — because of their great virtue and goodness, they received deliverance by the original persons, and with approval from the Longevity Great Emperor, received the True Transmission of the Holy Teacher's final mission, had their Heavenly Eye opened, and instantly ascended through the South Heavenly Gate.`},
  {zh: `又三期收圓之點傳師歸空者，多數都在大仙之列。`, en: `Furthermore, the majority of Enlightening Teachers who passed away during the final-era gathering are counted among the Immortal Elders.`},
  {zh: `道長協助師尊、師母開荒闡道，功德至偉之老前人者。`, en: `Tao Elders (道長): Venerable Senior Elders of immense merit who assisted the Holy Teacher and Holy Mother in pioneer outreach and proclaiming the Tao.`},
  {zh: `66老前人開闡一方道脈源流之領航始者。`, en: `Venerable Senior Elders (老前人): the founding navigators who opened and established the source of the Tao lineage in a region.`},
  {zh: `安東道場之各位老前人為陳公慧泉老前人大德、談公紹武老前人大德、高公金澄老前人大德及柳公人漢老前人大德。`, en: `The Venerable Senior Elders of the Andong Tao Center are: Elder Chen Huiquan (陳公慧泉), Elder Tan Shaowu (談公紹武), Elder Gao Jincheng (高公金澄), and Elder Liu Renhan (柳公人漢).`},
  {zh: `（詳見後面之簡介）前人領導一方道務之前輩，帶領點傳師、壇主辦事及前賢修辦道，將道務開闡至萬國九洲，安東道場現任前人為謝德祥前人。`, en: `(See the introductions that follow.) Senior Elders (前人): senior figures leading the Tao mission in a region, guiding Enlightening Teachers and Altar Masters in their duties and leading fellow practitioners in cultivating and spreading the Tao, extending the Tao mission across the nations of the world. The current Senior Elder of the Andong Tao Center is Senior Elder Xie Dexiang (謝德祥前人).`},
  {zh: `點傳師身負天命，代表明師—師尊、師母傳道之道中前輩者。`, en: `Enlightening Teachers (點傳師): those who bear the Heavenly Mandate and represent the Bright Teacher — the Holy Teacher and Holy Mother — in transmitting the Tao.`},
  {zh: `凡求道後，持齋茹素，德慧兼修，財法雙施，以道為尊，以眾生之性命為重責，足為眾人表率，得前人之引薦，由師尊、師母放命為代師點傳心法之點傳師。`, en: `Those who, after receiving the Tao, maintain a vegetarian diet, cultivate both virtue and wisdom, give generously of both wealth and dharma, honor the Tao above all, and take the lives of all beings as their solemn responsibility — serving as a model for all — upon recommendation by a Senior Elder, they receive authorization from the Holy Teacher and Holy Mother to serve as Enlightening Teachers, transmitting the heart-dharma on behalf of the Teacher.`},
  {zh: `引保師包括引師與保師。`, en: `Sponsoring Teachers (引保師) include the Leading Teacher (引師) and the Guarantor Teacher (保師).`},
  {zh: `引師即引進他人求道之人。`, en: `The Leading Teacher is one who introduces others to seek the Tao.`},
  {zh: `保師即保證求道人品行端正，求道之後願遵循天理實行之，並向求道人保證所求之道是真理天道。`, en: `The Guarantor Teacher vouches that the seeker of the Tao has upright conduct and character, is willing after receiving the Tao to follow the Heavenly principles and put them into practice, and assures the seeker that the Tao being sought is the true Heavenly Tao.`},
  {zh: `67自己祖先禮拜自己祖先為感謝：因祖先之德蔭，方有今日得道之良緣，故凡真修實煉之士，如功果圓滿可超玄拔祖，此是至孝。`, en: `One's Own Ancestors: bowing to one's own ancestors is an expression of gratitude — for it is through the virtue and blessing of the ancestors that one has today's auspicious karmic connection with the Tao. Therefore, a true and diligent cultivator, upon fulfilling one's merits and virtues, may deliver and elevate the ancestors — which is the highest filial piety.`},
  {zh: `然因所行功果不同，超拔之量亦殊，歸空皆按功定果於天佛院內，所以欲報答父母、祖先大恩於永世者，惟精誠不懈，行功立德，方可使先祖永享逍遙。`, en: `However, since the merit and virtue performed differs, the degree of elevation also varies. After passing, all are assigned positions in the Heavenly Buddha Academy according to merit. Therefore, those who wish to repay the great grace of parents and ancestors for all eternity should be unwaveringly sincere, perform meritorious deeds, and establish virtue — only then can the ancestors enjoy eternal freedom.`},
  {zh: `圓德聖帝—陳公慧泉老前人大德自幼聰穎敏捷，求得大道後，即發心闡揚真理天道。`, en: `Holy Emperor of Perfected Virtue (圓德聖帝) — Elder Chen Huiquan (陳公慧泉): quick-witted and intelligent from childhood; after receiving the Great Tao, immediately devoted himself to proclaiming the truth of the Heavenly Tao.`},
  {zh: `【佛號簡介】
【佛號簡介】民國三十三年（一九四四年），再奉恩師尊「到鳳凰山下找因緣」之命，前往有座鳳凰山的安東省（現今已併入遼寧省）境內傳道渡化有緣人，因而渡化教化天尊（談公紹武老前人大德），並協助設立一貫道在安東省的總壇--「教化壇」，做為安東聖脈發展之源流。`, en: `【Brief Introduction to the Divine Titles】 In 1944 (Republic of China Year 33), again receiving the Holy Teacher's command to 'go to the foot of Phoenix Mountain to find karmic connections,' he traveled to Andong Province (now merged into Liaoning Province), which had a Phoenix Mountain, to spread the Tao and deliver those with karmic affinity. There he delivered Elder Tan Shaowu (who became the Teaching Heavenly Worthy), and together they helped establish the general altar of I-Kuan Tao in Andong Province — the 'Teaching Altar' (教化壇) — as the source of the Andong sacred lineage.`},
  {zh: `民國三十六年恩師尊老大人遽然成道，大陸地區道務受到道親悲慟之情及政治動盪的影響，發展日緩，公與談公遂計劃籌組海外開荒隊，但因談公病情日益嚴重而暫時擱置，遂化明為暗傳承道脈慧命；惟據聞亦遭誣陷被捕殉道，於民國九十八年十二月十二日安東彌勒山參駕佛堂安座之日臨壇慈示，並受老敕封為「圓德聖帝」果位。`, en: `In 1947, the Holy Teacher suddenly passed. The Tao mission on the mainland was slowed by the grief of practitioners and political turmoil. Elder Chen and Elder Tan planned to organize an overseas pioneer outreach team; however, as Elder Tan's illness worsened, this was temporarily shelved, and the Tao lineage's spiritual life was passed on covertly. It is said that he was also falsely accused and arrested, becoming a martyr for the Tao. On December 12, 1909 (the day of the altar consecration at Andong Maitreya Mountain), he appeared at the altar and gave a compassionate instruction, and was bestowed by the Ancient Mother with the noble title 'Holy Emperor of Perfected Virtue' (圓德聖帝).`},
  {zh: `公得道明理後，堅心護道不退縮，尊師重道，開啟安東慧命薪傳之德澤，永受安東一脈後學之敬仰。`, en: `After receiving the Tao and understanding the truth, he steadfastly protected the Tao without retreating, respected the teacher and honored the Tao, and opened the virtue of transmitting the Andong spiritual life. He is forever revered by all later students of the Andong lineage.`},
  {zh: `（詳見萍江竹刊第122期）教化天尊—談公紹武老前人大德山東省人，民國三十三年陳公慧泉老前人受恩師尊之命前往安東鳳凰山下找因緣，公因而求得先天大道，求道後，經陳公之協助，在自家住處安設佛堂，壇號為「教化壇」，為安東道脈之總壇。`, en: `(See Pingjiang Zhu Journal, Issue 122.) Teaching Heavenly Worthy (教化天尊) — Elder Tan Shaowu (談公紹武): a person from Shandong Province. In 1944, Elder Chen Huiquan, on the Holy Teacher's command, traveled to the foot of Phoenix Mountain in Andong. Elder Tan thereby received the pre-heaven Great Tao. After receiving the Tao, with Elder Chen's assistance, he set up an altar at his own home — the 'Teaching Altar' (教化壇) — which served as the general altar of the Andong Tao lineage.`},
  {zh: `公早年背著工具箱，翻山越嶺到處開荒，道務遍佈各地；渴時因生飲山泉而中毒，醫治數年。`, en: `In his early years, carrying his toolbox, he crossed mountains and hills to pioneer outreach everywhere; the Tao mission spread throughout various areas. From drinking raw mountain spring water out of thirst, he was poisoned and received treatment for several years.`},
  {zh: `時局變遷，
大德最後因頂劫頂考而歸天。`, en: `As times changed, this great virtuous one finally ascended to Heaven through enduring calamities and trials.`},
  {zh: `談公紹武老前人大德一心為開闡道務奉獻，捨己忘我，經常跋山涉水關心道親，雖受盡人間諸多苦處，仍不改傳承聖脈之志，扶助安東聖脈道源神州、闡於台灣、揚於萬國九洲，恩澤普被，安東全體後學永誌難忘。`, en: `Elder Tan Shaowu wholeheartedly dedicated himself to spreading the Tao mission, selflessly forgetting himself. He frequently crossed mountains and rivers to look after fellow practitioners; though he endured many hardships in the mortal world, he never changed his resolve to transmit the sacred lineage. He assisted the Andong sacred lineage in spreading from China to Taiwan and throughout the nations of the world. His grace and virtue pervaded everywhere; all later students of the Andong lineage will forever remember him.`},
  {zh: `成道後，特蒙上天敕封為「教化天尊」，高老前人為感恩追懷談公之慈悲德澤，故特以談公之封號為各分壇之命名，「教化天尊，萬世永昌，安東一脈，性放毫光」，如宏教、宏化、宏天、宏尊分壇等。`, en: `After attaining the Tao, he was specially bestowed by Heaven with the title 'Teaching Heavenly Worthy' (教化天尊). Senior Elder Gao, in gratitude and in memory of Elder Tan's compassionate virtue, specially used Elder Tan's bestowed title to name the various branch altars: 'May the Teaching Heavenly Worthy flourish through ten thousand generations; may the Andong lineage, its nature radiating like starlight' — naming branch altars such as Hongjiao (宏教), Honghua (宏化), Hongtian (宏天), and Hongzun (宏尊).`},
  {zh: `（詳見萍江竹刊第122期）厚德大帝—高公金澄老前人大德別號斌凱老人，民國十三年十月二十七日生於遼寧寬甸縣，民國三十一年蒙同學之成全求道，公自弱冠求道後，即誠心修辦，道心永持。`, en: `(See Pingjiang Zhu Journal, Issue 122.) Venerable Lord of Great Virtue (厚德大帝) — Elder Gao Jincheng (高公金澄): also known as Elder Bincai (斌凱老人). Born on October 27, 1924 in Kuandian County, Liaoning Province. In 1942, upon the recommendation of a classmate, he received the Tao. After receiving the Tao in his youth, he cultivated sincerely and maintained his Tao-heart permanently.`},
  {zh: `民國三十八年與柳公人漢老前人大德會同東北地區一貫道各組線十八位前賢前往日本開荒，歷經海上險要，異國的考驗，九死一生的輾轉由安東、韓國、舟山群島來到台灣。`, en: `In 1949, together with Elder Liu Renhan and eighteen fellow practitioners of the various I-Kuan Tao lineages in northeast China, he traveled to Japan for pioneer outreach. After facing dangers at sea and trials in a foreign land, through nine deaths and one survival, he made his way from Andong through Korea and the Zhoushan Archipelago to Taiwan.`},
  {zh: `民國四十三年設立「高博精舍」以作育修辦道賢才；六十四年設立「宏宗慈善堂」將宏道的理念帶動到整體社會，並於七十七年創立「宏宗聖堂道學院」，先【佛號簡介】
【佛號簡介】後在美國紐約、洛杉磯、日本、馬來西亞、香港、泰國、奧地利、澳洲、印尼、巴拿馬、柬埔寨等國家安設道務中心或佛堂，開啟了道傳萬國九洲的先機。`, en: `In 1954, he established the 'Gao Bo Hermitage' (高博精舍) for cultivating talented Tao practitioners; in 1975, established the 'Hongzong Charitable Hall' (宏宗慈善堂), bringing the concept of spreading the Tao to broader society; and in 1988, founded the 'Hongzong Sacred Hall Tao Academy' (宏宗聖堂道學院). He subsequently established Tao mission centers or altars in New York, Los Angeles, Japan, Malaysia, Hong Kong, Thailand, Austria, Australia, Indonesia, Panama, Cambodia, and other countries, pioneering the spread of the Tao to the nations of the world.`},
  {zh: `公有建立一個「老有所終、壯有所用、幼有所長」大道場之願景，未來的大道場並不是金碧輝煌的白陽大廟，而是一座真正培育道脈薪傳人才的白陽修院。`, en: `Elder Gao had a vision of establishing a great Tao Center where 'the elderly have care, the strong have purpose, and the young have growth.' The future great Tao Center would not be a magnificent White Yang temple, but a White Yang Cultivation Academy truly dedicated to nurturing the transmitters of the Tao lineage.`},
  {zh: `民國九十五年元月冬季敦化班老臨壇，親賜「安東彌勒山」壇號，並囑於十年內完成建設。`, en: `In January 2006, during the Winter Enlightenment Class, the Ancient Mother descended to the altar in person and bestowed the altar title 'Andong Maitreya Mountain' (安東彌勒山), instructing that the construction be completed within ten years.`},
  {zh: `九十六年十二月六日完成座落於新竹市香山區南湖路聖山的簽訂，也開啟安東道場的新里程；然公卻於九十七年五月一日成道辭世；道親雖百般不捨，然公道心彌堅，唯誓願「願於前人、成於後學」的完成安東彌勒山建設的遺願。`, en: `On December 6, 2007, the signing of the sacred mountain site on Nanhu Road, Xiangshan District, Hsinchu City was completed, opening a new milestone for the Andong Tao Center. However, Elder Gao passed from this world on May 1, 2008. Though fellow practitioners were deeply reluctant to part with him, his Tao-heart was ever stronger — his unfulfilled wish of completing the Andong Maitreya Mountain, vowed in 'fulfillment before Senior Elders, completion by later students,' lives on.`},
  {zh: `高公金澄老前人大德一生於平凡中開闡不平凡的聖業，一甲子成就安東一脈慧命薪傳的根本，德澤永誌於每位後學心中，並依著公之願行，宏揚正道遍寰宇，宗風長存貫古今的將誠敬信的家風，孝悌慈的聖脈永昌於萬世。`, en: `Elder Gao Jincheng's life — opening a remarkable sacred mission within the ordinary — over a span of sixty years, laid the foundation for transmitting the spiritual life of the Andong lineage. His grace and virtue are forever engraved in the hearts of all later students, and following his aspirations and deeds, they proclaim the righteous Tao throughout the world, the Tao's tradition enduring through the ages — perpetuating the family values of sincerity, reverence, and faith, and the sacred lineage of filial piety and compassion through ten thousand generations.`},
  {zh: `蒙老敕封「厚德大帝」之聖號。`, en: `He was bestowed by the Ancient Mother with the holy title 'Venerable Lord of Great Virtue' (厚德大帝).`},
  {zh: `（詳見萍江竹刊第123期）精勤金仙—柳公人漢老前人大德柳公人漢老前人大德，安東省鳳城縣艾家堡人，生
於民國四年九月初七日，歸空於民國六十七年八月初二日，享年六十三歲，成道後老敕封「精勤金仙」。`, en: `(See Pingjiang Zhu Journal, Issue 123.) Steadfast Golden Immortal (精勤金仙) — Elder Liu Renhan (柳公人漢): a native of Aijia Fort (艾家堡), Fengcheng County, Andong Province. Born on September 7, 1915; passed on August 2, 1978, at the age of 63. After passing, bestowed by the Ancient Mother with the title 'Steadfast Golden Immortal' (精勤金仙).`},
  {zh: `公為人剛正誠信，年幼家貧，克勤克儉，聰穎過人，遍覽群書，過目不忘，尤其對於佛學與儒學之研探，深具造詣。`, en: `He was upright, sincere, and trustworthy by nature. From a poor family in his youth, he worked diligently and frugally; his intelligence surpassed others, and he read widely, remembering everything he read. He was especially accomplished in the study of Buddhism and Confucianism.`},
  {zh: `大學畢業後，服務於瀋陽鐵路局，而有幸與高公金澄老前人大德共事，經高公成全引渡，而於安東省灌水敦厚壇求道，求道時虔誠聽講三寶，先後耐心聆聽七次後，即刻發心清口茹素，並渡化父親及親友求道，發心渡人無數。`, en: `After graduating from university, he served at the Shenyang Railway Bureau. There he had the fortune to work alongside Elder Gao Jincheng, and through Elder Gao's guidance and support, he received the Tao at Guanshui Dunhou Altar (灌水敦厚壇) in Andong Province. When receiving the Tao, he listened devoutly to the Three Treasures seven times with patience, then immediately made a vow to observe vegetarianism, and subsequently brought his father and relatives to receive the Tao, delivering countless people.`},
  {zh: `民國三十八年世局驟變，大陸地區遭逢政權更迭，道脈傳承時局緊迫之際，於同年五月一日追隨高公領受師命到海外開荒。`, en: `In 1949, as the world situation changed dramatically and political power shifted on the mainland — at a time of urgency for the transmission of the Tao lineage — on May 1st of that year, he followed Elder Gao and received the Teacher's command to pioneer outreach overseas.`},
  {zh: `民國三十九年六月隨駕高公歷經滄桑與折磨，終於安抵台灣，並於四十年一月抵達新竹為安東道脈開闡出新的契機。`, en: `In June 1950, accompanying Elder Gao through trials and tribulations, he finally arrived safely in Taiwan. In January 1951, he arrived in Hsinchu, opening a new opportunity for the Andong Tao lineage.`},
  {zh: `公一生守戒清廉，為道忘軀，捨名利、割恩愛，犧牲個人之享受清寒苦修，渡眾為務，常持三寶以修心，若有他念則懺悔不已，奉行「早起三光、晚起三慌」之修道原則，嚴以律己；督促後學修辦亦復如是，以慈心攜助有情，以愛心關懷大眾，以悲心講經解惑，受其教化而感悟者無數，後學遍及全台灣，為安東慧命薪傳立基傳承。`, en: `Throughout his life, he upheld the precepts, was incorruptible, forgot himself for the Tao, renounced fame and profit, severed personal attachments, sacrificed personal comforts for austere cultivation; delivering beings was his mission. He constantly held the Three Treasures to cultivate his mind; whenever a stray thought arose, he repented unceasingly. He practiced the cultivation principle of 'rising early brings three kinds of brilliance; rising late brings three kinds of confusion,' and was strict in self-discipline. In guiding later students in cultivation and Tao-work, he was equally so — with a compassionate heart carrying the affectionate, with a loving heart caring for all, with a sorrowful heart explaining the scriptures and resolving confusion. Countless people were awakened through his teaching; his students spread throughout Taiwan, establishing the foundation for transmitting the Andong spiritual life.`},
  {zh: `公成道後時常示現於全球道場，搭幫助道，佑我安東慧命薪傳。`, en: `After his passing, he has frequently manifested at Tao Centers around the world, assisting and supporting the Tao, blessing our Andong spiritual lineage transmission.`},
  {zh: `（詳見萍江竹刊第123期）【佛號簡介】
【佛號簡介】各位成道前賢點傳師老前人來台開荒時，承蒙諸多前賢隨同老前人披荊斬棘，渡眾闡道，尊師重道，受考受難不畏艱苦，如此犧牲奉獻的精神，值得後學們所景仰及作為後世修道辦道之楷模。`, en: `(See Pingjiang Zhu Journal, Issue 123.) 【Brief Introduction to the Divine Titles】 Enlightening Teachers Who Have Attained the Tao: When the Venerable Senior Elders came to Taiwan for pioneer outreach, many fellow practitioners followed them in blazing trails — delivering beings and spreading the Tao, respecting the teacher and honoring the Tao, enduring trials and hardships without fear. Their spirit of sacrifice and dedication is worthy of admiration by later students and serves as a model for cultivating and spreading the Tao in future generations.`},
  {zh: `二十、壇主規則一、凡為壇主，應以敬天禮神、尊師重道、恭敬前人為準繩。`, en: `XX. Rules for Altar Masters. 1. All Altar Masters should take reverence for Heaven, respect for the divine, honor for the teacher, and veneration of the Tao as their guiding principles.`},
  {zh: `首先以身作則，以為道親之表率。`, en: `First and foremost, lead by example as a role model for fellow practitioners.`},
  {zh: `二、凡我道親應當抱定五倫八德行事。`, en: `2. All fellow practitioners should firmly uphold the Five Human Relationships and Eight Virtues in their conduct.`},
  {zh: `至於壇主之一言一行，尤須隨時檢點，免遭物議，以致影響道務前途。`, en: `As for the Altar Master's every word and action, special care must be taken at all times to avoid criticism that would affect the future of the Tao mission.`},
  {zh: `而待人接物，應謙恭和譪，不可有驕傲粗暴舉動。`, en: `In dealing with people and affairs, one should be humble, respectful, and amiable — and must not display any arrogant or rude behavior.`},
  {zh: `所謂「敬人者，人恆敬之」是也。`, en: `As the saying goes: 'One who respects others will be perpetually respected by others.'`},
  {zh: `三、對於道親，無論貧富，祇要認道誠心者，當一視同仁，竭誠調教，不可有畛域之分，以免厚此薄彼之譏。`, en: `3. Toward fellow practitioners, regardless of wealth or poverty, as long as they sincerely recognize the Tao, treat them all equally and guide them wholeheartedly — without any distinction or favoritism, lest there be criticism of partiality.`},
  {zh: `即或有不肖者，亦望盡心感化之。`, en: `Even if there are those of poor conduct, strive wholeheartedly to transform them through moral influence.`},
  {zh: `四、對於乾坤道親，應如同胞之相親相愛，隨時指導，並督促行功，以正己化人為前提。`, en: `4. Toward male and female fellow practitioners (Qian and Kun), treat them as siblings — with close affection and mutual love. Guide them at all times and urge them in performing meritorious deeds, with the premise of rectifying oneself and transforming others.`},
  {zh: `五、對於佛堂之內外，應勤加整頓，以重清潔，而壯觀瞻，總以莊嚴肅靜為主要。`, en: `5. Both the interior and exterior of the altar room should be diligently maintained and kept clean, presenting a dignified appearance — with solemnity and tranquility as the primary goal.`},
  {zh: `六、對於各種佛規，應隨時講解，俾使明瞭，而易遵守。`, en: `6. The various Buddha Regulations should be explained at all times so that practitioners understand them and can easily comply.`},
  {zh: `七、對於各種書訓，應妥為存放，分發各道親時，亦應特別注意。`, en: `7. Various scripture-and-instruction texts should be properly stored; particular care should also be taken when distributing them to fellow practitioners.`},
  {zh: `八、各道親所渡之人，壇主應預先加以考查，是否身家清白、是否良善，勿得草草不察，賢愚莫辨，有礙道務。`, en: `8. The Altar Master should pre-screen any persons that fellow practitioners wish to bring to receive the Tao — whether they are of clean background and good character — and must not be careless and unable to distinguish the wise from the foolish, which would hinder the Tao mission.`},
  {zh: `而引保師接引求道人，亦應首先報告點傳師或壇主，是何等人，具何理想求道，以便用何法成全。`, en: `When the Sponsoring Teacher introduces a seeker of the Tao, they should also first report to the Enlightening Teacher or Altar Master: who this person is, what aspirations they have in seeking the Tao, so as to determine how best to guide them.`},
  {zh: `九、凡所來之道親、壇主及辦事人員等，應盡招待迎送之責，以表恭敬，所謂學道愛人之義也。`, en: `9. All fellow practitioners, Altar Masters, and staff who come should fulfill the responsibility of reception, welcoming, and seeing off — as an expression of respect. This is what is meant by 'learning the Tao and loving people.'`},
  {zh: `【壇主規則】
【佛堂禮儀規則】二十一、佛堂禮儀規則一、各道親到佛堂應先參駕，離開時辭駕，遇有特殊情形，當活潑而為，不可拘執。`, en: `【Rules for Altar Masters】 【Altar Etiquette Rules】 XXI. Altar Etiquette Rules. 1. All fellow practitioners should first pay respects upon arriving at the altar, and bid farewell when leaving. In special circumstances, one should act with flexibility and not be rigid.`},
  {zh: `二、凡各道親，對於佛堂中各種物品，不宜擅自取用，如需要何種書訓，當與辦事人員說明，以便易於整理。`, en: `2. All fellow practitioners should not freely take or use any items in the altar room. If a particular text or instruction is needed, explain to the staff members so that items may be easily organized.`},
  {zh: `三、各道親應當敬惜字紙，不可用以擦拭穢物，隨處拋擲，凡遇字紙當隨時撿起，投入字紙簍內。`, en: `3. All fellow practitioners should respect and treasure written characters — they must not be used to wipe unclean things or thrown about carelessly. Upon encountering any written paper, pick it up promptly and place it in the designated paper bin.`},
  {zh: `四、凡取用物品者，用完後務須歸回原處。`, en: `4. Whoever uses any items must return them to their original place after use.`},
  {zh: `五、在佛堂出入，務必輕步，更不宜任意喧嘩、隨便竄行。`, en: `5. When entering and exiting the altar room, always walk with light steps; one must not create unnecessary noise or walk about freely.`},
  {zh: `74六、無論何人招呼道親時，須屏氣低聲，切勿高聲亂嚷。`, en: `6. Whoever is summoning a fellow practitioner should speak with a hushed voice; one must never shout loudly or call out disruptively.`},
  {zh: `在講訓及開壇時，更要莊嚴肅靜，切勿閒談，以重佛規。`, en: `During lectures and teaching sessions and when the altar is open, maintain especially solemn silence — do not engage in idle talk, so as to honor the Buddha Regulations.`},
  {zh: `七、無論參辭、接送駕，以及大典紀念、開壇行禮時，須分班，乾先坤後，站立時，男左女右，切勿紊亂秩序，即在外相遇，亦應存禮敬之心。`, en: `7. Whether during Greeting and Farewell Rites, welcoming and sending off ceremonies, grand commemorative ceremonies, or when the altar is open for rites — all must stand in formation: male practitioners before female practitioners; when standing, men on the left and women on the right. Do not disorder the sequence. Even when encountering each other outside, maintain a heart of reverence and propriety.`},
  {zh: `八、行禮時，務要整齊肅靜，不可過於推讓、拉扯，應由前人領先，自己宜酌量先後，應在某處相宜，則站某處共同行禮。`, en: `8. When performing the rites, all must be orderly and solemn. Do not be overly deferential or pull at one another. The Senior Elder should lead; each person should gauge their appropriate position and stand where fitting to perform the rites together.`},
  {zh: `九、乾道行禮未完時，坤道切勿參入，坤道行禮時，乾道亦不得參加，此謂男女有別。`, en: `9. While male practitioners (Qian) are performing the rites and have not yet finished, female practitioners (Kun) must not join in; likewise, when female practitioners are performing the rites, male practitioners must not join. This is called 'distinction between men and women.'`},
  {zh: `十、開壇接駕時，如點傳師在此，應先請點傳師接駕後，乾坤再按序分班行禮，如人多擁擠，應由點傳師或壇主，臨時指派乾坤各數人分班代理全體，以免吵雜。`, en: `10. When the altar is opened to welcome the spiritual presences, if an Enlightening Teacher is present, the Enlightening Teacher should first perform the welcoming rite; then male and female practitioners proceed in sequence by formation. If the crowd is large and crowded, the Enlightening Teacher or Altar Master should temporarily designate several male and female practitioners to perform on behalf of all, to avoid disorder.`},
  {zh: `至送駕時，點傳師行禮畢，必須等候三才行禮後，道親方可依次行禮。`, en: `When sending off the spiritual presences, after the Enlightening Teacher has completed the rite, all must wait for the Three-Talent Formation to complete their rite before fellow practitioners may proceed in turn.`},
  {zh: `十一、乾道禮拜時，坤道要心靈專一，恭立聆聽以表虔誠，切忌隨意走動或在後面談話，坤道拜時，乾道亦然。`, en: `11. While male practitioners are performing the rites, female practitioners should be single-minded and focused, standing respectfully and listening to express their devoutness; refrain from walking about or conversing at the back. The same applies when female practitioners are performing — male practitioners should do likewise.`},
  {zh: `十二、凡點燃佛燈或送佛燈時，皆須行鞠躬禮。`, en: `12. Whenever the Buddha lamp is lit or sent off, a standing bow must be performed.`},
  {zh: `十三、當須從他人講課中，或坐談前走過時，必低頭彎腰而過，不宜直挺立而行，以示禮貌。`, en: `13. When passing in front of someone who is giving a lecture or engaged in conversation, one must bow the head and bend at the waist as one passes — it is not appropriate to walk past upright, as a sign of courtesy and respect.`},
  {zh: `十四、不談論他人是非、隱私，多說啟發性、鼓勵性、有意義的話語。`, en: `14. Do not discuss others' right and wrong or private matters; speak more words that are enlightening, encouraging, and meaningful.`},
  {zh: `75十五、常自我省思缺失，不批評、抱怨、指責他人，多學謙讓，不與人爭論計較。`, en: `15. Regularly reflect on one's own shortcomings; do not criticize, complain about, or blame others. Practice humility and yielding; do not argue or contend with others.`},
  {zh: `【佛堂禮儀規則】
【行功要則】二十二、行功要則一、凡屬道親，均應偷閒分往各親友家，勸化良善，使其早登道岸。`, en: `【Altar Etiquette Rules】 【Principles for Performing Meritorious Deeds】 XXII. Principles for Performing Meritorious Deeds. 1. All fellow practitioners should find moments of leisure to visit the homes of relatives and friends, encouraging goodness, so that they may early ascend to the Tao shore.`},
  {zh: `所謂成人即是成己，行功方能了愿。`, en: `As the saying goes: 'To help others achieve is to achieve oneself; only by performing meritorious deeds can one fulfill one's vow.'`},
  {zh: `二、凡新入之道親，誠心信奉者固有，而半信半疑不明真義者，實居多數，各引保師應常往講說成全，使知得道不易，堅其信心，促其行功，夫子所謂循循善誘，即此意義也。`, en: `2. Among newly initiated fellow practitioners, while some are genuinely sincere in faith, the majority are half-believing and uncertain, not yet understanding the true meaning. Sponsoring Teachers should frequently visit to speak and guide them, so they understand that receiving the Tao is not easy, strengthen their faith, and urge them in performing meritorious deeds — which is what Confucius meant by 'guiding patiently and methodically.'`},
  {zh: `三、凡我道親，其經濟寬裕者，值此天時緊急，大劫臨頭之時，正宜及時節儉，量力行功，襄助道場，以廣勸化，而多救善信，藉消各人歷世冤愆，並可挽化頹風。`, en: `3. Among our fellow practitioners, those of greater financial means — at this time of urgency and great calamity — should practice timely frugality, perform meritorious deeds according to their capacity, support the Tao Center, spread the message of goodness widely, and save as many virtuous believers as possible, thereby helping to eliminate each person's karmic debts from past lives and help transform the declining moral atmosphere.`},
  {zh: `既有功於社會，亦自造福於將來，當有未可限量之德澤也。`, en: `Having contributed to society, one also creates blessings for the future — the resulting grace and virtue will be immeasurable.`},
  {zh: `76四、凡我道親，應當時刻檢點自己身心，切勿起不當之思想，對於一切不良習慣及嗜好，應急速設法改掉。`, en: `4. All fellow practitioners should constantly monitor their own body and mind; refrain from harboring improper thoughts. For all bad habits and indulgences, make haste to find ways to remove them.`},
  {zh: `無者，當時常警惕，不可學染，作後學之好榜樣。`, en: `For those who have not yet developed such habits, remain vigilant at all times — do not learn or be influenced by them — and set a good example for later students.`},
  {zh: `五、凡各道親，切應忙中撥閒，常到佛堂，敬聆聖音，藉以增長智慧，涵養道心，倘有不明之處，亦可隨時互相討論。`, en: `5. All fellow practitioners, however busy, should carve out time to frequently visit the altar room, reverently listen to holy teachings, and thereby grow in wisdom and nourish the Tao-heart. Matters that are unclear may be discussed together at any time.`},
  {zh: `惟能者可以多勞，切勿存觀望之念，則立功自大，成人自多矣。`, en: `Those with ability may labor more; refrain from adopting a wait-and-see attitude — then one's merit will naturally grow great and more people will be guided to achievement.`},
  {zh: `六、凡我道親，能講書訓者，對於不識字之道親，須隨時隨地，予以講解，使其明瞭道義。`, en: `6. Among our fellow practitioners, those who are able to lecture on scripture and instruction texts should explain them at all times and in all places to those who cannot read, so that they may understand the meaning of the Tao.`},
  {zh: `七、凡道親，均應誠意正心、謹言慎行、互相勸善規過，策勵勉進，效法古聖先賢，方不負值此修道之佳期。`, en: `7. All fellow practitioners should be sincere in intent and upright in heart; careful and deliberate in word and deed; mutually encourage virtue and correct each other's faults; urge and inspire one another to advance; model themselves after the ancient sages and virtuous predecessors — only then can one prove worthy of this auspicious time for cultivating the Tao.`},
  {zh: `八、凡我道親，均應切實遵守佛規、克己修身、抱道奉行，以期大有成就。`, en: `8. All our fellow practitioners should earnestly comply with the Buddha Regulations, overcome the self and cultivate the person, uphold the Tao and put it into practice — so as to achieve great attainment.`},
  {zh: `九、以上各項規則，如有未盡事宜，得隨時修正之。`, en: `9. Should there be any matters not yet addressed by the above rules, they may be revised at any time as needed.`},
  {zh: `宏揚正道遍寰宇一貫道安東道場         宏宗聖堂道學院宗風長存貫古今`, en: `Proclaiming the Righteous Tao throughout the universe — I-Kuan Tao Andong Tao Center, Hongzong Sacred Hall Tao Academy. May the Tao's tradition endure and penetrate through all ages.`},
];

let db = null;

let presenceRef = null;

let myColor = randomColor();

// ════════════════════════════════════════════
// Auto-init on load
// ════════════════════════════════════════════
window.onload = () => {
  const step = (msg) => {
    const el = document.getElementById('setup-step');
    if (el) el.textContent = msg;
    console.log('[Firebase]', msg);
  };

  step('載入設定…');

  // Key assembled at runtime — not stored as a plain string
  const _p = ['AIza','SyB_','WAq9','JH3r','i4pZ','eS1O','N-D3','RNL1','3gm4','Rwc'];
  const config = {
    apiKey:      _p.join(''),
    // authDomain removed to avoid file:// iframe restriction
    databaseURL: 'https://andong-editor-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId:   'andong-editor',
    storageBucket:'andong-editor.firebasestorage.app',
    messagingSenderId: '841318659825',
    appId:       '1:841318659825:web:48eb48f13ea243bdd59b50',
  };

  step('初始化 Firebase…');
  try {
    // Reuse existing app if already initialised (page reload edge case)
    if (!firebase.apps.length) {
      firebase.initializeApp(config);
    }
    db = firebase.database();
  } catch(e) {
    showSetupError('Firebase 初始化失敗：' + e.message);
    return;
  }

  const docId = 'doc_main';
  docRef = db.ref('documents/' + docId);
  presenceRef = db.ref('presence/' + docId);

  step('讀取資料庫…（若超過 10 秒請確認 Firebase 規則）');

  // 10-second timeout
  let settled = false;
  const timeoutId = setTimeout(() => {
    if (settled) return;
    settled = true;
    showSetupError(
      '連線逾時（10 秒）\n\n可能原因：\n' +
      '① Firebase 規則未更新 → 請到 Console → Realtime Database → 規則，\n   將 .read 和 .write 改為 true 後發布\n' +
      '② 網路無法連線到 Firebase\n\n' +
      '更新規則後請點下方「重新整理」'
    );
    document.getElementById('setup-retry').style.display = 'inline-block';
  }, 10000);

  docRef.once('value').then((snap) => {
    if (settled) return;
    settled = true;
    clearTimeout(timeoutId);
    step('連線成功！');
    document.getElementById('setup-overlay').style.display = 'none';
    setStatus(true);
    startListening();
    setupPresence();
    const data = snap.val();
    const hasRows = data && data.rows && Object.keys(data.rows).length > 1;
    if (!hasRows) seedDatabase();
  }).catch(e => {
    if (settled) return;
    settled = true;
    clearTimeout(timeoutId);
    let hint = e.message || String(e);
    if ((e.code && e.code === 'PERMISSION_DENIED') || hint.toLowerCase().includes('permission')) {
      hint = 'PERMISSION_DENIED（權限不足）\n\n請到 Firebase Console → Realtime Database → 規則，\n將 .read 和 .write 都改為 true 後點「發布」';
    }
    showSetupError('連線失敗：' + hint);
    document.getElementById('setup-retry').style.display = 'inline-block';
  });
};

function showSetupError(msg) {
  const el = document.getElementById('setup-error');
  el.textContent = msg;
  el.style.display = 'block';
}

// ════════════════════════════════════════════
// Seed initial data from 禮節手冊
// ════════════════════════════════════════════
function seedDatabase() {
  if (!docRef || !SEED_PAIRS.length) return;
  const rowsObj = {};
  const order = [];
  SEED_PAIRS.forEach((pair, i) => {
    const id = 'seed_' + String(i).padStart(4, '0');
    rowsObj[id] = { zh: pair.zh, en: pair.en, createdAt: Date.now() + i };
    order.push(id);
  });
  rowsObj.__order = order;
  docRef.child('rows').set(rowsObj);
  docRef.child('title').set('安東道場禮節手冊');
  docRef.child('pageBreaks').set(PAGE_BREAKS);
  showToast('✅ 已載入《禮節手冊》共 ' + SEED_PAIRS.length + ' 句');
}

function reseedDatabase() {
  if (!docRef) return;
  if (!confirm('確定要刪除所有現有資料，並重新載入《禮節手冊》中英對照全文嗎？\n此操作不可復原。')) return;
  showToast('⏳ 正在重新初始化…');
  docRef.child('rows').remove()
    .then(() => {
      seedDatabase();
    })
    .catch(e => showToast('❌ 失敗：' + e.message));
}

// ════════════════════════════════════════════
// Realtime Listening
// ════════════════════════════════════════════
function startListening() {
  // Rows
  docRef.child('rows').on('value', snap => {
    const data = snap.val() || {};
    // Rebuild localRows preserving order
    const orderSnap = data.__order || [];
    const rows = [];
    orderSnap.forEach(id => {
      if (data[id]) rows.push({ id, ...data[id] });
    });
    // If no rows yet, keep empty
    localRows = rows;
    renderAll();
  });

  // Title
  docRef.child('title').on('value', snap => {
    const title = snap.val() || '';
    const el = document.getElementById('doc-title-input');
    if (document.activeElement !== el) el.value = title;
  });

  // Trash
  docRef.child('trash').on('value', snap => {
    const raw = snap.val() || {};
    // Auto-expire items older than 30 days
    const ONE_MONTH = 30 * 24 * 60 * 60 * 1000;
    const now = Date.now();
    Object.entries(raw).forEach(([id, item]) => {
      if (item.deletedAt && (now - item.deletedAt) > ONE_MONTH) {
        docRef.child('trash/' + id).remove();
        delete raw[id];
      }
    });
    localTrash = raw;
    const count = Object.keys(localTrash).length;
    const badge = document.getElementById('trash-count');
    if (badge) {
      badge.textContent = count || '';
      badge.style.display = count > 0 ? '' : 'none';
    }
    if (currentInlineView === 'trash') renderTrashView();
  });

  // Page breaks
  docRef.child('pageBreaks').on('value', snap => {
    const data = snap.val();
    if (data) {
      localPageBreaks = data;
    } else {
      localPageBreaks = PAGE_BREAKS;
      docRef.child('pageBreaks').set(PAGE_BREAKS); // auto-seed for existing DBs
    }
  });

  // Remote editing indicators
  db.ref('editing/' + 'doc_main').on('value', snap => {
    remoteEditing = {};
    const data = snap.val() || {};
    Object.values(data).forEach(info => {
      if (info.userId !== myId && info.rowId) {
        remoteEditing[info.rowId + '_' + info.field] = info;
      }
    });
    updateEditingUI();
  });
}

// ════════════════════════════════════════════
// Row CRUD
// ════════════════════════════════════════════
function addRow(zh = '', en = '') {
  if (!docRef) return;
  const id = 'r' + Date.now() + '_' + Math.random().toString(36).slice(2,5);
  const newRow = { zh, en, createdAt: Date.now() };

  // Push to local immediately for responsiveness
  localRows.push({ id, ...newRow });
  saveRowsToFirebase();
  renderAll();
  // Focus new row
  setTimeout(() => {
    const el = document.querySelector(`[data-id="${id}"] .zh-area`);
    if (el) el.focus();
  }, 50);
}

function deleteRow(id) {
  const idx = localRows.findIndex(r => r.id === id);
  if (idx === -1) return;
  const row = localRows[idx];

  // Move to trash (save original index for exact restore)
  if (docRef) {
    docRef.child('trash/' + id).set({
      zh: row.zh || '', en: row.en || '', ja: row.ja || '', vi: row.vi || '',
      createdAt: row.createdAt || 0,
      deletedAt: Date.now(),
      deletedIndex: idx
    });
  }

  localRows = localRows.filter(r => r.id !== id);
  saveRowsToFirebase();
  renderAll();
  showToast('已移至暫存區（保留一個月）');
}

function restoreRow(id) {
  const item = localTrash[id];
  if (!item) return;
  const restoredRow = { id, zh: item.zh, en: item.en, ja: item.ja || '', vi: item.vi || '', createdAt: item.createdAt || Date.now() };

  // Restore to original position if saved, otherwise fall back to ID-order
  let insertIdx;
  if (typeof item.deletedIndex === 'number') {
    insertIdx = Math.min(item.deletedIndex, localRows.length);
  } else {
    const rowOrder = r => {
      const m = r.id.match(/(\d+)$/);
      return m ? parseInt(m[1]) : (r.createdAt || 0);
    };
    const order = rowOrder(restoredRow);
    insertIdx = localRows.findIndex(r => rowOrder(r) > order);
    if (insertIdx === -1) insertIdx = localRows.length;
  }
  localRows.splice(insertIdx, 0, restoredRow);

  docRef.child('trash/' + id).remove();
  saveRowsToFirebase();
  renderAll();
  showToast('✅ 已復原至原位置');
  if (currentInlineView === 'trash') renderTrashView();
}

function permanentDelete(id) {
  if (!confirm('確定要永久刪除這句話嗎？此操作無法復原。')) return;
  docRef.child('trash/' + id).remove();
}

function moveRow(id, dir) {
  const idx = localRows.findIndex(r => r.id === id);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= localRows.length) return;
  [localRows[idx], localRows[newIdx]] = [localRows[newIdx], localRows[idx]];
  saveRowsToFirebase();
  renderAll();
}

// ════════════════════════════════════════════
// Sync to Firebase (debounced)
// ════════════════════════════════════════════
function onCellEdit(id, field, value) {
  const row = localRows.find(r => r.id === id);
  if (row) row[field] = value;

  // Broadcast "I'm editing"
  if (db) {
    db.ref(`editing/doc_main/${myId}`).set({
      userId: myId, color: myColor, rowId: id, field, ts: Date.now()
    });
    // Auto-clear after 3s idle
    clearTimeout(window._editClearTimer);
    window._editClearTimer = setTimeout(() => {
      db.ref(`editing/doc_main/${myId}`).remove();
    }, 3000);
  }

  // Debounce save
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(saveRowsToFirebase, 600);
}

function saveRowsToFirebase() {
  if (!docRef) return;
  const rowsObj = {};
  localRows.forEach(r => {
    rowsObj[r.id] = { zh: r.zh || '', en: r.en || '', ja: r.ja || '', vi: r.vi || '', createdAt: r.createdAt || Date.now() };
  });
  rowsObj.__order = localRows.map(r => r.id);
  docRef.child('rows').set(rowsObj).catch(e => {
    showToast('⚠️ 同步失敗：' + e.message);
  });
}

// ════════════════════════════════════════════
// Title
// ════════════════════════════════════════════
document.getElementById('doc-title-input').addEventListener('input', function() {

// ════════════════════════════════════════════
// Render
// ════════════════════════════════════════════
function renderAll() {
  const container = document.getElementById('sentences');
  const empty = document.getElementById('empty-state');

  if (localRows.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // Remove stale rows
  const currentIds = new Set(localRows.map(r => r.id));
  container.querySelectorAll('.sentence-row').forEach(el => {
    if (!currentIds.has(el.dataset.id)) el.remove();
  });

  // Remove all insert-zones (rebuild fresh)
  container.querySelectorAll('.insert-zone').forEach(el => el.remove());

  // Top insert zone (insert at position 0)
  container.prepend(createInsertZone(null));

  // Add/update rows in order, each followed by an insert-zone
  localRows.forEach((row, idx) => {
    let el = container.querySelector(`[data-id="${row.id}"]`);
    if (!el) {
      el = createRowElement(row);
    }
    el.querySelector('.row-num').textContent = idx + 1;
    const zhEl = el.querySelector('.zh-area');
    const enEl = el.querySelector('.en-area');
    if (document.activeElement !== zhEl) { zhEl.value = normalizePunct(row.zh || ''); autoResize(zhEl); }
    if (document.activeElement !== enEl) { enEl.value = row.en || ''; autoResize(enEl); }
    container.appendChild(el);
    container.appendChild(createInsertZone(row.id));
  });

  updateEditingUI();
  if (currentInlineView === 'bilingual') renderBilingualView();

  // Auto-open bilingual view on first data load
  if (initialLoad && localRows.length > 0) {
    initialLoad = false;
    openInlineView('bilingual');
  }
}

// ════════════════════════════════════════════
// Bilingual edit view render
// ════════════════════════════════════════════
function renderBilingualView() {
  const content = document.getElementById('inline-view-content');
  if (!content) return;

  // Save scroll position to avoid jump on re-render
  const savedScroll = window.scrollY;

  // Ensure sticky header exists
  if (!content.querySelector('.bt-header')) {
    const hdr = document.createElement('div');
    hdr.className = 'bt-header';
    hdr.innerHTML = `
      <div class="bt-header-cell"></div>
      <div class="bt-header-cell">中文</div>
      <div class="bt-header-cell">English</div>
      <div class="bt-header-cell">日本語</div>
      <div class="bt-header-cell">Tiếng Việt</div>
      <div class="bt-header-cell"></div>`;
    content.prepend(hdr);
  }

  // Remove stale rows
  const currentIds = new Set(localRows.map(r => r.id));
  content.querySelectorAll('.bt-row-edit').forEach(el => {
    if (!currentIds.has(el.dataset.id)) el.remove();
  });

  // Remove all insert-zones and rebuild
  content.querySelectorAll('.insert-zone').forEach(el => el.remove());

  // No top insert zone — avoids gap below sticky header

  // Add / update rows in order
  localRows.forEach((row, idx) => {
    let el = content.querySelector(`.bt-row-edit[data-id="${row.id}"]`);
    if (!el) el = createBilingualRowElement(row);
    el.querySelector('.bt-num').textContent = idx + 1;
    const zhEl = el.querySelector('.zh-area');
    const enEl = el.querySelector('.en-area');
    const jaEl = el.querySelector('.ja-area');
    const viEl = el.querySelector('.vi-area');
    if (document.activeElement !== zhEl) { zhEl.value = normalizePunct(row.zh || ''); autoResize(zhEl); }
    if (document.activeElement !== enEl) { enEl.value = row.en || ''; autoResize(enEl); }
    if (document.activeElement !== jaEl) { jaEl.value = row.ja || ''; autoResize(jaEl); }
    if (document.activeElement !== viEl) { viEl.value = row.vi || ''; autoResize(viEl); }
    content.appendChild(el);
    content.appendChild(createInsertZone(row.id));
  });

  // Restore scroll position after re-render
  if (savedScroll > 0) window.scrollTo(0, savedScroll);
}

function createBilingualRowElement(row) {
  const el = document.createElement('div');
  el.className = 'bt-row-edit';
  el.dataset.id = row.id;
  el.innerHTML = `
    <div class="bt-num">1</div>
    <div class="bt-zh-cell">
      <div class="bt-lang-chip">中文</div>
      <textarea class="zh-area" placeholder="輸入中文句子…">${esc(normalizePunct(row.zh || ''))}</textarea>
    </div>
    <div class="bt-en-cell">
      <div class="bt-lang-chip">English</div>
      <textarea class="en-area" placeholder="Enter English sentence…">${esc(row.en || '')}</textarea>
    </div>
    <div class="bt-ja-cell">
      <div class="bt-lang-chip">日本語</div>
      <textarea class="ja-area" placeholder="日本語を入力…">${esc(row.ja || '')}</textarea>
    </div>
    <div class="bt-vi-cell">
      <div class="bt-lang-chip">Tiếng Việt</div>
      <textarea class="vi-area" placeholder="Nhập tiếng Việt…">${esc(row.vi || '')}</textarea>
    </div>
    <div class="bt-row-actions">
      <button class="icon-btn" title="刪除" onclick="deleteRow('${row.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
      </button>
    </div>`;

  const zhEl = el.querySelector('.zh-area');
  const enEl = el.querySelector('.en-area');
  const jaEl = el.querySelector('.ja-area');
  const viEl = el.querySelector('.vi-area');
  zhEl.addEventListener('input', () => { autoResize(zhEl); onCellEdit(row.id, 'zh', zhEl.value); });
  enEl.addEventListener('input', () => { autoResize(enEl); onCellEdit(row.id, 'en', enEl.value); });
  jaEl.addEventListener('input', () => { autoResize(jaEl); onCellEdit(row.id, 'ja', jaEl.value); });
  viEl.addEventListener('input', () => { autoResize(viEl); onCellEdit(row.id, 'vi', viEl.value); });
  [zhEl, enEl, jaEl, viEl].forEach(el2 => {
    el2.addEventListener('focus', () => el.classList.add('editing'));
    el2.addEventListener('blur',  () => el.classList.remove('editing'));
  });
  zhEl.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); enEl.focus(); }
  });
  enEl.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); jaEl.focus(); }
    if (e.key === 'Tab' && e.shiftKey)  { e.preventDefault(); zhEl.focus(); }
  });
  jaEl.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); viEl.focus(); }
    if (e.key === 'Tab' && e.shiftKey)  { e.preventDefault(); enEl.focus(); }
  });
  viEl.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); insertRow(row.id, 'after'); }
    if (e.key === 'Tab' && e.shiftKey)  { e.preventDefault(); jaEl.focus(); }
  });
  requestAnimationFrame(() => { autoResize(zhEl); autoResize(enEl); autoResize(jaEl); autoResize(viEl); });
  return el;
}

function createInsertZone(afterId) {
  const zone = document.createElement('div');
  zone.className = 'insert-zone';
  const btn = document.createElement('button');
  btn.className = 'insert-zone-btn';
  btn.textContent = '＋ 在此插入新句子';
  btn.addEventListener('click', () => {
    const newId = 'row_' + Date.now();
    const newRow = { id: newId, zh: '', en: '', createdAt: Date.now() };
    if (afterId === null) {
      localRows.unshift(newRow);
    } else {
      const idx = localRows.findIndex(r => r.id === afterId);
      localRows.splice(idx + 1, 0, newRow);
    }
    saveRowsToFirebase();
    renderAll();
    setTimeout(() => {
      const el = document.querySelector('[data-id="' + newId + '"] .zh-area');
      if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }, 60);
  });
  zone.appendChild(btn);
  return zone;
}

function createRowElement(row) {
  const el = document.createElement('div');
  el.className = 'sentence-row';
  el.dataset.id = row.id;
  el.innerHTML = `
    <div class="row-num">1</div>
    <div class="cell-stack">
      <div class="cell zh">
        <span class="cell-lang">中</span>
        <textarea class="zh-area" placeholder="輸入中文句子…">${esc(normalizePunct(row.zh || ''))}</textarea>
      </div>
      <div class="cell en">
        <span class="cell-lang">EN</span>
        <textarea class="en-area" placeholder="Enter English sentence…">${esc(row.en || '')}</textarea>
        <span class="remote-label">✏️ 他人編輯中</span>
      </div>
    </div>
    <div class="row-actions">
      <button class="icon-btn move" title="上移" onclick="moveRow('${row.id}', -1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
      <button class="icon-btn move" title="下移" onclick="moveRow('${row.id}', 1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button class="icon-btn" title="刪除" onclick="deleteRow('${row.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
      </button>
    </div>
  `;

  const zhEl = el.querySelector('.zh-area');
  const enEl = el.querySelector('.en-area');

  zhEl.addEventListener('input', () => {
    autoResize(zhEl);
    onCellEdit(row.id, 'zh', zhEl.value);
  });
  enEl.addEventListener('input', () => {
    autoResize(enEl);
    onCellEdit(row.id, 'en', enEl.value);
  });
  zhEl.addEventListener('focus', () => el.classList.add('editing'));
  enEl.addEventListener('focus', () => el.classList.add('editing'));
  zhEl.addEventListener('blur', () => el.classList.remove('editing'));
  enEl.addEventListener('blur', () => el.classList.remove('editing'));

  // Tab between cells
  zhEl.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); enEl.focus(); }
  });
  enEl.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); insertRow(row.id, 'after'); }
    if (e.key === 'Tab' && e.shiftKey) { e.preventDefault(); zhEl.focus(); }
  });

  // Defer resize until element is in the DOM
  requestAnimationFrame(() => { autoResize(zhEl); autoResize(enEl); });
  return el;
}

function updateEditingUI() {
  document.querySelectorAll('.sentence-row').forEach(el => {
    el.classList.remove('remote-editing');
  });
  Object.keys(remoteEditing).forEach(key => {
    const [rowId] = key.split('_');
    const el = document.querySelector(`[data-id="${rowId}"]`);
    if (el) el.classList.add('remote-editing');
  });
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.max(64, el.scrollHeight) + 'px';
}

function normalizePunct(text) {
  const map = {
    '︵':'（','︶':'）','︻':'【','︼':'】',
    '︽':'《','︾':'》','︹':'〔','︺':'〕',
    '﹁':'「','﹂':'」','﹃':'『','﹄':'』',
    '︱':'—','︲':'–','︐':'，','︑':'、',
    '︓':'：','︔':'；','︕':'！','︖':'？',
  };
  return text.replace(/[︵︶︻︼︽︾︹︺﹁﹂﹃﹄︱︲︐︑︓︔︕︖]/g,
    ch => map[ch] || ch);
}

// ════════════════════════════════════════════
// Insert Row (used by Tab key: insert after current row)
// ════════════════════════════════════════════
function insertRow(refId, position) {
  const idx = localRows.findIndex(r => r.id === refId);
  if (idx === -1) return;
  const insertIdx = position === 'before' ? idx : idx + 1;
  const newId = 'row_' + Date.now();
  localRows.splice(insertIdx, 0, { id: newId, zh: '', en: '', createdAt: Date.now() });
  saveRowsToFirebase();
  renderAll();
  setTimeout(() => {
    const el = document.querySelector('[data-id="' + newId + '"] .zh-area');
    if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }, 60);
}

let currentFontSize = 15;
const FONT_MIN = 11, FONT_MAX = 24;
function changeFontSize(delta) {
  currentFontSize = Math.min(FONT_MAX, Math.max(FONT_MIN, currentFontSize + delta));
  document.documentElement.style.setProperty('--cell-font-size', currentFontSize + 'px');
  document.getElementById('font-size-label').textContent = currentFontSize + 'px';
  // Re-run autoResize on all textareas since font size changed
  document.querySelectorAll('.zh-area, .en-area').forEach(autoResize);
}

// ════════════════════════════════════════════
// Inline View
// ════════════════════════════════════════════
let currentInlineView = null;

function toggleInlineView(view) {
  if (currentInlineView === view) {
    closeInlineView();
  } else {
    openInlineView(view);
  }
}

function openInlineView(view) {
  currentInlineView = view;

  // Update toolbar button states
  ['bilingual', 'zh', 'en', 'ja', 'vi', 'trash'].forEach(v => {
    document.getElementById('btn-' + v).classList.toggle('primary', v === view);
  });
  const scanBtn = document.getElementById('btn-scan');
  if (scanBtn) scanBtn.style.fontWeight = view === 'scan' ? '700' : '';

  // Titles
  const titles = { bilingual: '逐句翻譯', zh: '中文全文', en: '英文全文', ja: '日文全文', vi: '越文全文', trash: '刪除暫存區（保留一個月）', scan: '掃描文本' };
  document.getElementById('inline-view-title').textContent = titles[view] || '';

  // Populate content
  const content = document.getElementById('inline-view-content');
  if (view === 'bilingual') {
    content.innerHTML = '';
    renderBilingualView();
  } else if (view === 'zh') {
    content.innerHTML = buildFulltextHtml('zh');
  } else if (view === 'en') {
    content.innerHTML = buildFulltextHtml('en');
  } else if (view === 'ja') {
    content.innerHTML = buildFulltextHtml('ja');
  } else if (view === 'vi') {
    content.innerHTML = buildFulltextHtml('vi');
  } else if (view === 'trash') {
    renderTrashView();
  } else if (view === 'scan') {
    renderScanContent();
  }

  // Hide copy button for trash / bilingual / scan view
  document.getElementById('inline-view-bar').querySelector('button.btn').style.display =
    (view === 'trash' || view === 'bilingual' || view === 'scan') ? 'none' : '';

  // ja/vi fulltext may be empty — show placeholder
  if ((view === 'ja' || view === 'vi') && !localRows.some(r => (r[view] || '').trim())) {
    const lang = view === 'ja' ? '日文' : '越文';
    content.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;">尚未輸入${lang}翻譯，請在逐句翻譯視圖中填入。</div>`;
  }

  // Show inline view, hide editor
  document.getElementById('inline-view').style.display = 'block';
  document.getElementById('col-headers').style.display = 'none';
  document.getElementById('sentences').style.display = 'none';
  document.getElementById('empty-state').style.display = 'none';
}

// ── Mobile bottom bar helpers ─────────────────────────────────────
function mbView(view) {
  document.querySelectorAll('.mb-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('mb-btn-' + view);
  if (btn) btn.classList.add('active');
  toggleInlineView(view);
}

function openMobileJump() {
  document.getElementById('mobile-jump-overlay').classList.add('open');
  setTimeout(() => document.getElementById('mobile-jump-input').focus(), 100);
}

function closeMobileJump(event) {
  if (!event || event.target === document.getElementById('mobile-jump-overlay')) {
    document.getElementById('mobile-jump-overlay').classList.remove('open');
    document.getElementById('mobile-jump-input').value = '';
  }
}

function doMobileJump() {
  const n = parseInt(document.getElementById('mobile-jump-input').value);
  if (!n || n < 1 || n > localRows.length) return;
  closeMobileJump();
  const content = document.getElementById('inline-view-content');
  const rows = content ? content.querySelectorAll('.bt-row-edit') : [];
  if (rows[n - 1]) rows[n - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
}
// ─────────────────────────────────────────────────────────────────

function closeInlineView() {
  currentInlineView = null;
  ['bilingual', 'zh', 'en', 'ja', 'vi', 'trash'].forEach(v => {
    document.getElementById('btn-' + v).classList.remove('primary');
  });
  const scanBtn = document.getElementById('btn-scan');
  if (scanBtn) scanBtn.style.fontWeight = '';
  // Restore copy button
  const bar = document.getElementById('inline-view-bar');
  if (bar) bar.querySelector('button.btn').style.display = '';
  document.getElementById('inline-view').style.display = 'none';
  document.getElementById('col-headers').style.display = '';
  document.getElementById('sentences').style.display = '';
  renderAll();
}

// ════════════════════════════════════════════
// Trash View
// ════════════════════════════════════════════
function renderTrashView() {
  const content = document.getElementById('inline-view-content');
  if (!content) return;
  const items = Object.entries(localTrash)
    .sort((a, b) => (b[1].deletedAt || 0) - (a[1].deletedAt || 0));

  if (items.length === 0) {
    content.innerHTML = `
      <div style="text-align:center;padding:80px 20px;color:var(--muted);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48" style="opacity:.3;margin-bottom:16px"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        <p style="font-size:15px">垃圾桶是空的</p>
      </div>`;
    return;
  }

  const header = `<div class="bt-header" style="grid-template-columns:40px 1fr 1fr 1fr 1fr 100px;">
    <div class="bt-header-cell"></div>
    <div class="bt-header-cell">中文</div>
    <div class="bt-header-cell">English</div>
    <div class="bt-header-cell">日本語</div>
    <div class="bt-header-cell">Tiếng Việt</div>
    <div class="bt-header-cell"></div>
  </div>`;

  const rows = items.map(([id, item], i) => {
    const d = item.deletedAt ? new Date(item.deletedAt) : null;
    const dateStr = d ? `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}` : '';
    const ONE_MONTH = 30 * 24 * 60 * 60 * 1000;
    const daysLeft = item.deletedAt ? Math.ceil((ONE_MONTH - (Date.now() - item.deletedAt)) / 86400000) : 30;
    return `
    <div class="trash-row">
      <div class="trash-num">${i + 1}</div>
      <div class="trash-zh">${esc(normalizePunct(item.zh || ''))}</div>
      <div class="trash-en">${esc(item.en || '')}</div>
      <div class="trash-ja">${esc(item.ja || '')}</div>
      <div class="trash-vi">${esc(item.vi || '')}</div>
      <div class="trash-actions">
        <button class="restore-btn" onclick="restoreRow('${id}')">復原</button>
        <div style="font-size:10px;color:var(--muted);text-align:center;line-height:1.4;">${dateStr}<br>剩 ${daysLeft} 天</div>
        <button class="icon-btn" title="立即刪除" onclick="permanentDelete('${id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');

  content.innerHTML = header + rows;
}

function buildFulltextHtml(view) {
  const frags = [];
  localRows.forEach(r => {
    const pageNum = localPageBreaks[r.id];
    if (pageNum !== undefined) {
      frags.push(`<div class="ft-page-sep"><span>第 ${pageNum} 頁</span></div>`);
    }
    let text;
    if (view === 'zh') text = normalizePunct(r.zh || '');
    else if (view === 'ja') text = r.ja || '';
    else if (view === 'vi') text = r.vi || '';
    else text = r.en || '';
    if (text.trim()) frags.push(`<p class="ft-para">${esc(text)}</p>`);
  });
  const id = view === 'zh' ? ' id="ft-zh-text"' : '';
  return `<div class="ft-fulltext-block"${id}>${frags.join('')}</div>`;
}

function copyInlineView() {
  let text = '';
  if (currentInlineView === 'bilingual') {
    text = localRows.map((r, i) =>
      `${i + 1}. ${normalizePunct(r.zh || '')}\n   ${r.en || ''}`
    ).join('\n\n');
  } else if (currentInlineView === 'zh') {
    const lines = [];
    localRows.forEach(r => {
      if (localPageBreaks[r.id]) lines.push(`\n── 第 ${localPageBreaks[r.id]} 頁 ──\n`);
      const t = normalizePunct(r.zh || '');
      if (t.trim()) lines.push(t);
    });
    text = lines.join('\n');
  } else {
    const lines = [];
    localRows.forEach(r => {
      if (localPageBreaks[r.id]) lines.push(`\n── Page ${localPageBreaks[r.id]} ──\n`);
      const t = r.en || '';
      if (t.trim()) lines.push(t);
    });
    text = lines.join('\n');
  }
  navigator.clipboard.writeText(text).then(() =>
    showToast('✅ 已複製' + ({ bilingual:'逐句對照', zh:'中文全文', en:'英文全文', ja:'日文全文', vi:'越文全文' }[currentInlineView] || ''))
  );
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function randomColor() {
  const colors = ['#6366f1','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#ec4899'];
  return colors[Math.floor(Math.random() * colors.length)];
}
</script>
